<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Cuadra</title>
    <meta name="description" content="Control de gastos frente a tu presupuesto mensual" />
    <meta name="theme-color" content="#0d090f" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cuadra" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icono.svg" type="image/svg+xml" />
    <link rel="icon" href="./icono-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Si la página llega sin estilos (por ejemplo, abierta justo mientras se
      // publica una versión nueva), se recarga una vez sola.
      window.addEventListener("load", function () {
        try {
          var sinEstilos = getComputedStyle(document.documentElement).getPropertyValue("--fondo").trim() === "";
          if (sinEstilos && !sessionStorage.getItem("cuadra:recarga-estilos")) {
            sessionStorage.setItem("cuadra:recarga-estilos", "1");
            // Borra las copias guardadas (puede haber un archivo a medias) y recarga
            var borrar = window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve();
            borrar.catch(function () {}).then(function () { location.reload(); });
          } else if (!sinEstilos) sessionStorage.removeItem("cuadra:recarga-estilos");
        } catch (e) {}
      });
    </script>
  </body>
</html>
